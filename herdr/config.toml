onboarding = false
[keys]
prefix = "backtick"
split_vertical = ["prefix+v", "prefix+%"]         # side-by-side (tmux %)
split_horizontal = ["prefix+minus", "prefix+\""]  # stacked (tmux ")
last_pane = "prefix+a"                            # last used pane (tmux last-pane)
resize_pane_left  = ["prefix+shift+left"]
resize_pane_down  = ["prefix+shift+down"]
resize_pane_up    = ["prefix+shift+up"]
resize_pane_right = ["prefix+shift+right"]

[theme]
name = "catppuccin"
auto_switch = false
